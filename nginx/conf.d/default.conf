server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://matriarcatelemed.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name matriarcatelemed.com.br;

    ssl_certificate /etc/letsencrypt/live/matriarcatelemed.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matriarcatelemed.com.br/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://telemedicina-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.matriarcatelemed.com.br;

    ssl_certificate /etc/letsencrypt/live/matriarcatelemed.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matriarcatelemed.com.br/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://telemedicina-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

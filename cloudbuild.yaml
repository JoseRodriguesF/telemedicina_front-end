steps:
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args: ['-c', 'docker pull southamerica-east1-docker.pkg.dev/${PROJECT_ID}/matriarca/frontend:latest || exit 0']
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build \
        --cache-from southamerica-east1-docker.pkg.dev/${PROJECT_ID}/matriarca/frontend:latest \
        --build-arg NEXT_PUBLIC_API_URL=${_API_URL} \
        --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=$$GOOGLE_CLIENT_ID \
        --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$$GOOGLE_MAPS_API_KEY \
        -t southamerica-east1-docker.pkg.dev/${PROJECT_ID}/matriarca/frontend:latest .
  secretEnv: ['GOOGLE_CLIENT_ID', 'GOOGLE_MAPS_API_KEY']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'southamerica-east1-docker.pkg.dev/${PROJECT_ID}/matriarca/frontend:latest']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'telemedicina-frontend'
  - '--image'
  - 'southamerica-east1-docker.pkg.dev/${PROJECT_ID}/matriarca/frontend:latest'
  - '--region'
  - 'southamerica-east1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'

images:
- 'southamerica-east1-docker.pkg.dev/${PROJECT_ID}/matriarca/frontend:latest'

substitutions:
  _API_URL: 'https://telemedicina-api-931296712104.southamerica-east1.run.app'

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/GOOGLE_CLIENT_ID/versions/latest
    env: 'GOOGLE_CLIENT_ID'
  - versionName: projects/${PROJECT_ID}/secrets/GOOGLE_MAPS_API_KEY/versions/latest
    env: 'GOOGLE_MAPS_API_KEY'
